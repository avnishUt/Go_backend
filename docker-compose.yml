services:
  api:
    build: .
    container_name: restaurant_inventory_api
    environment:
      APP_ENV: development
      PORT: 8080
      POSTGRES_URL: postgres://restaurant_app:restaurant_secret@postgres:5432/restaurant_inventory?sslmode=disable
      MONGO_URL: mongodb://restaurant_app:restaurant_secret@mongo:27017/restaurant_inventory_events?authSource=admin
      JWT_SECRET: change-me-in-production
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: restaurant_inventory_postgres
    environment:
      POSTGRES_DB: restaurant_inventory
      POSTGRES_USER: restaurant_app
      POSTGRES_PASSWORD: restaurant_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant_app -d restaurant_inventory"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7
    container_name: restaurant_inventory_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: restaurant_app
      MONGO_INITDB_ROOT_PASSWORD: restaurant_secret
      MONGO_INITDB_DATABASE: restaurant_inventory_events
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
