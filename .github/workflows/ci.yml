name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go mod tidy
      - run: go test ./...
      - run: go build ./...
      - run: test -f docs/openapi.yaml
      - run: test -f docs/runbook.md
      - run: test -f docs/deployment.md
